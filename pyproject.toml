[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callverse"
version = "0.1.0"
description = "A pretend call center with AI workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "simpy>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3", "plotly>=5.0"]
rag = ["chromadb>=1.0"]          # the rules search; optional because it is a big install

[tool.setuptools.packages.find]
include = ["callverse*", "workforce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
