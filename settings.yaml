# Shared settings. Everyone uses these values. Change them only with team agreement.

llm:
  model: "llama3.1:8b"      # the exact Ollama model name and tag
  temperature: 0.2

embeddings:
  model: "nomic-embed-text" # the model used to search the company rules

rag:
  store: "chroma"           # the rules search lives in Chroma, the tables in PostgreSQL

database:
  # The address of your PostgreSQL database is read from the .env file (see .env.example),
  # so each person can use their own password without putting it on GitHub.
  url_from_env: "DATABASE_URL"

call:
  max_turns: 12             # a call stops after this many customer messages (outcome "abandoned")

money:
  currency: "EUR"           # every amount is stored in cents: 2999 means 29.99 EUR

paths:
  policies: "data/policies"
  raw: "data/raw"
  index: "data/index"