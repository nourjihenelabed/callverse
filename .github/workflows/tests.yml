# Runs the test suite on every push and pull request.
# The tests need no Ollama, no PostgreSQL and no downloaded data: they use fake AI models,
# a temporary SQLite database and small made-up rows (see tests/conftest.py).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CallVerse and pytest
        run: pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest -q
